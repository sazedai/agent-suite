[project]
name = "agent-suite"
version = "0.1.0"
description = "AI agent suite: 15 specialized agents for sales, marketing, content, operations, and personal productivity"
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.80.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "aiohttp>=3.10.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "agents*", "workflows*", "scripts*"]
